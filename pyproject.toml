[project]
name = "vkv-engine"
version = "0.1.0"
description = "Industrial-grade KV Cache management engine for LLM inference"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "prometheus-client>=0.19.0",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["vkv*"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]

